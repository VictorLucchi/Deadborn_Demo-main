<div id="game-hud" class="hud">

    <div class="hud-avatar">
        <div class="hud-avatar-frame">
            <img id="hud-avatar-image" src="" alt="">
        </div>

        <div class="hud-rune hud-rune-top"></div>
        <div class="hud-rune hud-rune-bottom"></div>
    </div>


    <div class="hud-info">

        <div class="hud-name">
            <span id="hud-name">HADES</span>
        </div>


        <div class="hud-stat hud-health">

            <div class="hud-stat-line">
                <div
                    id="hud-health-fill"
                    class="hud-stat-fill"
                ></div>
            </div>

            <span
                id="hud-health-text"
                class="hud-stat-text"
            >
                VIDA 110/110
            </span>

        </div>


        <div class="hud-stat hud-mana">

            <div class="hud-stat-line">
                <div
                    id="hud-mana-fill"
                    class="hud-stat-fill"
                ></div>
            </div>

            <span
                id="hud-mana-text"
                class="hud-stat-text"
            >
                MANA 43/43
            </span>

        </div>

    </div>


    <div class="hud-equipment">

        <div class="hud-equipment-frame">
            <span id="hud-weapon-icon">⚔</span>
        </div>

    </div>

</div>
